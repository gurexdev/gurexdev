<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="José Gutiérrez — Desarrollador de software">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1e293b"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="m"><rect width="1200" height="340" fill="url(#fade)"/></mask>
    <clipPath id="r"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .l{opacity:0;animation:in .01s forwards}
    .l1{animation-delay:.4s}.l2{animation-delay:1.1s}.l3{animation-delay:1.9s}.l4{animation-delay:2.6s}.l5{animation-delay:3.4s}.l6{animation-delay:4.1s}
    @keyframes in{to{opacity:1}}
    .cur{animation:blink 1s steps(1) infinite 4.4s;opacity:0}
    @keyframes blink{0%{opacity:1}50%{opacity:0}}
    .pulse{animation:p 2s ease-in-out infinite}
    @keyframes p{50%{opacity:.35}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="340" fill="#0b1220"/>
    <rect width="1200" height="340" fill="url(#dots)" mask="url(#m)"/>
    <rect width="1200" height="5" fill="#3b6cff"/>
  </g>
  <g class="sans">
    <text x="56" y="88" class="mono" font-size="13" letter-spacing="1.6" fill="#7aa2ff" font-weight="600">DESARROLLADOR DE SOFTWARE · SEGURIDAD DE APLICACIONES</text>
    <text x="54" y="150" font-size="50" font-weight="800" fill="#f8fafc" letter-spacing="-1.2">José Gutiérrez</text>
    <text x="56" y="194" font-size="18" fill="#94a3b8">Sistemas web, bases de datos y seguridad de aplicaciones.</text>
    <g transform="translate(56 232)">
      <rect width="300" height="36" rx="18" fill="#0f2a1c" stroke="#166534"/>
      <circle cx="20" cy="18" r="5" fill="#22c55e" class="pulse"/>
      <text x="36" y="23" font-size="14" font-weight="600" fill="#bbf7d0">Disponible · remoto y Ecuador</text>
    </g>
    <text x="56" y="306" class="mono" font-size="13" fill="#64748b">Manta, Ecuador  ·  TypeScript · Python · Java · PostgreSQL</text>
  </g>
  <g transform="translate(640 46)">
    <rect width="510" height="250" rx="14" fill="#020617" stroke="#1e293b"/>
    <circle cx="22" cy="22" r="5.5" fill="#334155"/><circle cx="40" cy="22" r="5.5" fill="#334155"/><circle cx="58" cy="22" r="5.5" fill="#334155"/>
    <text x="80" y="27" class="mono" font-size="12" fill="#64748b">jose@codegurex: ~</text>
    <line x1="0" y1="44" x2="510" y2="44" stroke="#1e293b"/>
    <g class="mono" font-size="14.5" xml:space="preserve">
      <text x="22" y="78" class="l l1"><tspan fill="#22c55e">$</tspan><tspan fill="#e2e8f0"> cat experiencia.log</tspan></text>
      <text x="22" y="102" class="l l2" fill="#94a3b8"><tspan fill="#7aa2ff">2022</tspan>  Consultorio Adulam · sistema de recetas</text>
      <text x="22" y="126" class="l l3" fill="#94a3b8"><tspan fill="#7aa2ff">2025</tspan>  CodeGurex · BARBUS, CostFlow</text>
      <text x="22" y="150" class="l l4" fill="#94a3b8"><tspan fill="#7aa2ff">2026</tspan>  Tahor Clean · web, CRM y servidor</text>
      <text x="22" y="194" class="l l5"><tspan fill="#22c55e">$</tspan><tspan fill="#e2e8f0"> sudo ufw status</tspan></text>
      <text x="22" y="218" class="l l6" fill="#86efac">Status: active</text>
      <rect x="22" y="228" width="9" height="3" fill="#e2e8f0" class="cur"/>
    </g>
  </g>
</svg>
